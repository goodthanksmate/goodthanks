---
layout: default
title: Blog
---
<h1 class="page-title">Blog</h1>

{% assign years = site.posts | group_by_exp: "p", "p.date | date: '%Y'" %}
{% for year in years %}
<section class="year">
  <h2 class="section-label">{{ year.name }}</h2>
  {% include post-list.html posts=year.items limit=1000 %}
</section>
{% else %}
<p class="muted">Nothing here yet.</p>
{% endfor %}
