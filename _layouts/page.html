---
layout: default
---
{% if page.url == "/owner/" %}<meta name="robots" content="noindex">{% endif %}
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
  </header>

  <div class="prose">
    {{ content }}
  </div>
  <script src="{{ '/assets/js/media.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>

  {% if page.url == "/guestbook/" and site.reactions_api %}{% include guestbook.html %}{% endif %}
</article>
