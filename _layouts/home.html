---
layout: default
---
<section class="intro prose">
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {{ content }}
</section>

<p id="today" class="today" hidden></p>
<p class="sign-nudge" hidden><a href="{{ '/guestbook/' | relative_url }}"><span class="emoji">👋</span> New here? Sign the guestbook</a></p>
<script src="{{ '/assets/js/today.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>

<section>
  <h2 class="section-label">Latest posts</h2>
  {% include post-list.html posts=site.posts limit=5 %}
  {% if site.posts.size > 5 %}
  <p class="more"><a href="{{ '/blog/' | relative_url }}">All posts →</a></p>
  {% endif %}
</section>
