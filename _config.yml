title: goodthanks
description: A blog, used occasionally.
url: https://goodthanks.org
timezone: Australia/Sydney
# Always show posts, even if their date is ahead of the server clock
future: true

permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed

# Extra nav tabs live in _tabs/ — each file becomes goodthanks.org/<filename>/
collections:
  tabs:
    output: true
    permalink: /:name/

defaults:
  # Set here rather than in index.md, because Pages CMS drops fields it doesn't know about
  - scope:
      path: "index.md"
    values:
      layout: home
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: tabs
    values:
      layout: page

# Emoji reactions under blog posts. reactions_api is the Cloudflare worker's address
# (leave it empty to hide reactions). Names must match REACTIONS in reactions-worker/worker.js
reactions_api: https://goodthanks-reactions.reactions-worker.workers.dev
reactions:
  - { name: like,  emoji: "👍", label: Like }
  - { name: love,  emoji: "❤️", label: Love }
  - { name: funny, emoji: "😂", label: Funny }
  - { name: cool,  emoji: "😎", label: Cool }
  - { name: dumb,  emoji: "🙄", label: Dumb }
  - { name: sad,   emoji: "😢", label: Sad }

exclude:
  - README.md
  - .pages.yml
  - reactions-worker
