media:
  input: assets/images
  output: /assets/images
  categories: [image, video]

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: image
        label: Preview image (optional, shown as a thumbnail in the post list)
        type: image
      - name: emoji
        label: Emoji (optional, shown next to the title)
        type: string
      - name: body
        label: Post (to add a video, upload it with the image button; paste a YouTube link on its own line to embed it)
        type: rich-text
        options:
          categories: [image, video]

  - name: tabs
    label: Tabs (extra pages)
    type: collection
    path: _tabs
    filename: "{primary}.md"
    view:
      fields: [title, order]
    fields:
      - name: title
        label: Title (shown in the menu)
        type: string
        required: true
      - name: emoji
        label: Emoji (optional, shown next to the title in the menu)
        type: string
      - name: order
        label: Menu position (lower = further left)
        type: number
        default: 10
      - name: body
        label: Content
        type: rich-text

  - name: home
    label: Home page
    type: file
    path: index.md
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Intro text
        type: rich-text