<form class="sign-form"{% if include.hidden %} hidden{% endif %}>
  <label class="name-field">
    <span>Your name</span>
    <input name="name" maxlength="24" required autocomplete="off">
  </label>
  <fieldset class="pic-picker">
    <legend>Pick an icon</legend>
    {% for e in site.guestbook_emojis %}<label><input type="radio" name="emoji" value="{{ e }}"{% if forloop.first %} checked{% endif %}><span>{{ e }}</span></label>
    {% endfor %}
  </fieldset>
  <button type="submit">{{ include.button | default: "Sign the guestbook" }}</button>
  <p class="form-msg" role="status"></p>
</form>
