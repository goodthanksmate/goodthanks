{% if include.posts.size > 0 %}
<ul class="post-list">
  {% for post in include.posts limit: include.limit %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d" }}</time>
    <a href="{{ post.url | relative_url }}">{% if post.emoji %}<span class="emoji">{{ post.emoji }}</span> {% endif %}{{ post.title }}</a>
    {% if post.image %}<a class="thumb" href="{{ post.url | relative_url }}" tabindex="-1" aria-hidden="true"><img src="{{ post.image | relative_url }}" alt="" loading="lazy"></a>{% endif %}
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">Nothing here yet.</p>
{% endif %}
